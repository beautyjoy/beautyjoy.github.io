---
layout: page
title: Announcements
---
{% for post in site.posts %}

{% capture section_content %}
<article>
  <a href="{{ post.url | prepend: site.baseurl }}">
    <h2>{{ post.title | escape }}</h2>
  </a>
  <div class="article-subheading">{{ post.date | date: "%Y-%m-%d" }}</div>

  <p>
    {{ post.excerpt }}
  </p>
</article>
{% endcapture %}
{% include section.html %}

{% endfor %}
